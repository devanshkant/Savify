spring:
  application:
    name: savify-backend
  main:
    allow-circular-references: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # ── Task 6: SMTP Configuration (Mailtrap sandbox) ──────────────────────────
  # In YAML all spring.* keys must live under the SAME root "spring:" block.
  # Having a second "spring:" key further down in the file would silently
  # override the first one and break the datasource config — so everything
  # lives here together.
  #
  # To switch to Gmail for production:
  #   host: smtp.gmail.com
  #   port: 587
  #   username / password → your Gmail address + App Password
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  expiration-ms: 86400000
  secret-key: ${JWT_SECRET_KEY}

# ── Task 6 (continued): application-level mail config ──────────────────────────
# The "from" address used in every outgoing email (see EmailService).
# Kept outside the spring.* namespace because it is an app-specific value,
# not a Spring Boot auto-configuration property.
app:
  mail:
    from: ${MAIL_FROM}